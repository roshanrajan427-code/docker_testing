
name: Go Backend run and deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Run tests
        run: go test ./...

      - name: Build Go application
        run: go build -o server .

      - name: Build Docker image
        run: docker build -t docker-demo:latest .

      - name: Create test container
        run: docker run -d --name demo-container -p 8082:8082 docker-demo:latest

      - name: Test container response
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:8082/; then
              exit 0
            fi
            sleep 2
          done
          docker logs demo-container
          exit 1

      - name: Remove test container
        if: always()
        run: docker rm -f demo-container || true

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to ECR
        if: github.event_name == 'push'
        run: |
          IMAGE_URI=628100075145.dkr.ecr.ap-south-1.amazonaws.com/demo-docker:latest
          docker tag docker-demo:latest "$IMAGE_URI"
          docker push "$IMAGE_URI"

      - name: Deploy to EC2
        if: github.event_name == 'push'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2-key.pem
          chmod 600 ~/.ssh/ec2-key.pem

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/ec2-key.pem ec2-user@"$EC2_HOST" << 'EOF'
            set -e

            aws ecr get-login-password --region ap-south-1 \
              | sudo docker login --username AWS --password-stdin \
                628100075145.dkr.ecr.ap-south-1.amazonaws.com

            sudo docker pull \
              628100075145.dkr.ecr.ap-south-1.amazonaws.com/demo-docker:latest

            sudo docker rm -f docker-demo-container || true

            sudo docker run -d \
              --name docker-demo-container \
              --restart unless-stopped \
              -p 8082:8082 \
              628100075145.dkr.ecr.ap-south-1.amazonaws.com/demo-docker:latest

            for i in {1..10}; do
              if curl --fail http://localhost:8082/; then
                exit 0
              fi
              sleep 2
            done

            sudo docker logs docker-demo-container
            exit 1
          EOF
