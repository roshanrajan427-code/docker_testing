name: Go Backend run and test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    # Allow checkout and reading repository contents
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Run tests
        run: go test ./...

      - name: Build Go application
        run: go build -o server .

      - name: Build Docker image
        run: docker build -t docker-demo:latest .

      - name: Create Docker container
        run: docker run -d --name demo-container -p 8082:8082 docker-demo:latest

      - name: Test container response
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:8082/; then
              exit 0
            fi
            sleep 2
          done
          docker logs demo-container
          exit 1

      - name: Remove Docker container
        if: always()
        run: docker rm -f demo-container || true

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image for ECR
        if: github.event_name == 'push'
        run: |
          docker tag docker-demo:latest 628100075145.dkr.ecr.ap-south-1.amazonaws.com/demo-docker:latest

      - name: Push Docker image to ECR
        if: github.event_name == 'push'
        run: |
          docker push 628100075145.dkr.ecr.ap-south-1.amazonaws.com/demo-docker:latest
